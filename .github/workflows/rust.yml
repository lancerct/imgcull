name: Rust
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format working copy and emit source for review
        shell: python
        run: |
          import subprocess, pathlib, json
          subprocess.run(["cargo", "fmt"], check=True)
          for p in subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines():
              if p.endswith(".rs"):
                  print("FORMATTED_SOURCE " + json.dumps({"path":p,"content":pathlib.Path(p).read_text(encoding="utf-8")}, ensure_ascii=True))
      - name: Build with locked dependencies
        run: cargo build --locked
      - name: Regression tests
        run: cargo test --locked --no-fail-fast
      - name: Lint
        if: always()
        run: cargo clippy --locked --all-targets -- -D warnings
