name: Rust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Collect draft formatting (restore check before ready)
        run: cargo fmt
      - name: Export formatted draft source for local source snapshot
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import base64, pathlib
          paths = ['src/calibration.rs','src/similarity.rs','src/policy.rs','src/review.rs','src/cli.rs','src/main.rs','src/lib.rs','tests/calibration_test.rs','tests/similarity_test.rs','tests/review_store_test.rs']
          for p in paths:
              data = base64.b64encode(pathlib.Path(p).read_bytes()).decode()
              for i in range(0,len(data),3000): print('FMTCHUNK '+p+' '+str(i//3000)+' '+data[i:i+3000])
          PY
      - name: Install Lua 5.1 for plugin contracts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Plugin syntax and SDK orchestration contracts
        if: runner.os == 'Linux'
        run: |
          find lightroom/ImgCull.lrplugin -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          mkdir -p target/lr-cross-language/export
          lua5.1 tests/lr_plugin_test.lua "$GITHUB_WORKSPACE"
      - name: Build with locked dependencies
        run: cargo build --locked
      - name: Regression tests
        env:
          IMGCULL_LR_FIXTURE: ${{ github.workspace }}/target/lr-cross-language/export
        run: cargo test --locked --no-fail-fast
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
