name: Rust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format staging copy and expose formatted sources
        shell: python
        run: |
          import subprocess, pathlib, json
          subprocess.run(["cargo", "fmt"], check=True)
          for name in subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines():
              if name.endswith(".rs"):
                  print("FORMATTED_SOURCE " + json.dumps({"path":name,"content":pathlib.Path(name).read_text(encoding="utf-8")}))
      - name: Build with locked dependencies
        run: cargo build --locked
      - name: Regression tests
        run: cargo test --locked --no-fail-fast
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
